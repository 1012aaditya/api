[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docuparse"
version = "0.1.0"
description = "Python client for the DocuParse API — Indian GST invoices as structured, validated JSON."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
keywords = ["gst", "invoice", "india", "ocr", "document-ai"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Documentation = "https://github.com/1012aaditya/api/tree/main/clients/python"

[tool.hatch.build.targets.wheel]
packages = ["src/docuparse"]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
# No "UP": this package supports Python 3.9, where `X | None` is not valid at
# runtime. The annotations use Optional/Union deliberately and consistently.
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
