# The whole stack, in one command:
#
#   docker compose up --build
#
# Then open http://localhost:3000 and sign up. Nothing else needs installing —
# not Python, not Node, not Postgres.
#
# This also runs the API against PostgreSQL rather than SQLite, which is what
# a real deployment uses.
#
# The optional pieces stay out of the way until asked for:
#
#   docker compose --profile redis up      # distributed rate limiting
#   docker compose --profile s3 up         # MinIO, to exercise STORAGE_BACKEND=s3

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docuparse
      POSTGRES_PASSWORD: docuparse
      POSTGRES_DB: docuparse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuparse -d docuparse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment: &backend-env
      APP_ENV: development
      APP_URL: http://localhost:8000
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://docuparse:docuparse@postgres:5432/docuparse
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage

      # Development values, and obviously so. Generate real ones before this
      # is reachable by anyone else:  openssl rand -hex 32
      JWT_SECRET: dev-only-jwt-secret-not-for-anything-real
      WEBHOOK_SECRET: dev-only-webhook-secret-not-for-anything-real

      # No extraction provider is configured, so /v1/invoices/extract returns
      # 503 rather than inventing invoice data. The qr and text_layer tiers
      # still read digital invoices with no model at all — which is most B2B
      # PDFs. To use a model, point these at any OpenAI-compatible endpoint
      # (a hosted API, or Ollama or vLLM on your own machine):
      #
      #   AI_PROVIDER: openai_compatible
      #   AI_BASE_URL: http://host.docker.internal:11434/v1
      #   AI_API_KEY: ...
      #   AI_MODEL: ...
      AI_PROVIDER: ${AI_PROVIDER:-openai_compatible}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - document-storage:/app/storage
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      <<: *backend-env
      # The API container applies migrations; this one waits for them rather
      # than racing to stamp the same revision.
      RUN_MIGRATIONS: "false"
    volumes:
      - document-storage:/app/storage
    command: ["python", "/app/scripts/run_worker.py"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # The browser resolves this, not the compose network — so it is
        # localhost, not http://api:8000.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docuparse
      MINIO_ROOT_PASSWORD: docuparse-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  document-storage:
  minio-data:
