[project]
name = "docuparse-backend"
version = "0.1.0"
description = "DocuParse — API-first document intelligence for Indian GST invoices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3.0",
    "email-validator>=2.1",  # pydantic EmailStr
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "redis>=5.0",
    "pypdfium2>=4.30",
    "zxing-cpp>=2.2",  # QR decoding, self-contained wheel (no libzbar)
    "pillow>=10.3",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "segno>=1.6",  # generates the QR codes the tier-0 fixtures need
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom
