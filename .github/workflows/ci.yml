name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Lint
        run: ruff check backend

      # The suite runs on SQLite with in-memory doubles, so CI needs no
      # services and no AI provider credentials.
      - name: Test
        working-directory: backend
        run: python -m pytest -q

      - name: Check migrations match the models
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-check.db
        run: |
          alembic upgrade head
          alembic check
